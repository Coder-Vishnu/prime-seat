name: Automated Rolling Schedule Synchronizer

on:
  schedule:
    # Run daily at 11:00 UTC (6:00 AM EST) when AMC updates morning box office schedules
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'

      - name: Install Python Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          playwright install --with-deps chromium

      - name: Execute Multi-Week Rolling Schedule Sync
        run: |
          python apps/api/src/scraper/multi_week_sync.py --days 38

      - name: Commit & Push Updated Schedule Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/data/tysons_schedule_db.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): automated rolling schedule update [skip ci]"
            git push
            echo "✓ Pushed updated showtime database to repository."
          else
            echo "✓ Schedule is already up to date for today."
          fi

      - name: Send Telemetry Push to ntfy
        if: success()
        run: |
          curl -s -X POST "https://ntfy.sh/prime-seat-tysons-vishnu" \
            -H "Content-Type: application/json" \
            -d '{"topic":"prime-seat-tysons-vishnu","title":"Schedule Synchronized","message":"Rolling multi-week AMC Tysons schedule database successfully updated.","priority":2,"tags":["calendar","sparkles"]}'
